<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Студия</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #0f1014;
            --glass: rgba(255, 255, 255, 0.06);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text: #ffffff;
            --text-muted: #8b8e96;
            --accent: #2299f8;
            --accent-gradient: linear-gradient(135deg, #2299f8 0%, #6a5af9 100%);
            --success: #4cd964;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding-bottom: 90px;
            min-height: 100vh;
            background-image: radial-gradient(circle at 10% 20%, rgba(34, 153, 248, 0.15) 0%, transparent 40%),
                              radial-gradient(circle at 90% 80%, rgba(106, 90, 249, 0.15) 0%, transparent 40%);
            background-attachment: fixed;
            overflow-x: hidden;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        .animate { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .hidden { display: none !important; }

        .header { padding: 20px 20px 10px 20px; }
        .header h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; }

        .card {
            background: var(--glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            margin: 0 15px 15px 15px;
            padding: 20px;
            transition: transform 0.2s ease, background 0.2s ease;
        }
        .card:active { transform: scale(0.98); background: rgba(255, 255, 255, 0.09); }

        .balance-row { display: flex; justify-content: space-between; align-items: center; }
        .balance-title { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; font-weight: 600; }
        .balance-amount { font-size: 36px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
        .balance-amount svg { width: 32px; height: 32px; fill: url(#grad); }
        .btn-accent {
            background: var(--accent-gradient);
            color: white; border: none; padding: 12px 24px; border-radius: 16px;
            font-weight: 700; font-size: 15px; cursor: pointer;
            box-shadow: 0 4px 15px rgba(34, 153, 248, 0.4);
            transition: transform 0.2s;
        }
        .btn-accent:active { transform: scale(0.95); }

        .action-item {
            display: flex; align-items: center; padding: 18px 0; gap: 15px;
            font-size: 16px; font-weight: 600; cursor: pointer;
            border-bottom: 1px solid var(--glass-border);
        }
        .action-item:last-child { border-bottom: none; padding-bottom: 0; }
        .action-item:first-child { padding-top: 0; }
        .action-icon { width: 28px; height: 28px; fill: var(--text); }
        .action-arrow { margin-left: auto; fill: var(--text-muted); width: 20px; height: 20px; }

        .templates-scroll { display: flex; gap: 12px; overflow-x: auto; padding: 5px 15px 20px 15px; scrollbar-width: none; }
        .templates-scroll::-webkit-scrollbar { display: none; }
        .tpl-card {
            min-width: 140px; height: 190px; border-radius: 20px;
            position: relative; background-size: cover; background-position: center;
            display: flex; align-items: flex-end; flex-shrink: 0; overflow: hidden;
            border: 1px solid var(--glass-border);
        }
        .tpl-card::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to top, rgba(15,16,20,0.9) 0%, transparent 60%); }
        .tpl-name { position: relative; z-index: 1; padding: 15px 10px; font-size: 14px; font-weight: 700; width: 100%; text-align: center; }

        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: rgba(15, 16, 20, 0.85);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--glass-border);
            display: flex; justify-content: space-around; padding: 12px 0 20px 0; z-index: 100;
        }
        .nav-btn {
            display: flex; flex-direction: column; align-items: center;
            color: var(--text-muted); font-size: 11px; font-weight: 600; gap: 4px;
            background: none; border: none; cursor: pointer; transition: color 0.3s;
        }
        .nav-btn svg { width: 24px; height: 24px; fill: var(--text-muted); transition: fill 0.3s; }
        .nav-btn.active { color: var(--accent); }
        .nav-btn.active svg { fill: var(--accent); }

        .gen-textarea {
            width: 100%; background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border);
            border-radius: 16px; color: white; padding: 15px; font-size: 16px;
            height: 120px; resize: none; margin-bottom: 15px; outline: none; transition: border 0.3s;
        }
        .gen-textarea:focus { border-color: var(--accent); }
        .gen-btn {
            width: 100%; padding: 18px; border-radius: 16px; border: none;
            background: var(--accent-gradient); color: white; font-size: 16px;
            font-weight: 800; cursor: pointer; box-shadow: 0 4px 15px rgba(34, 153, 248, 0.4);
            display: flex; justify-content: center; align-items: center; gap: 8px;
            transition: transform 0.2s;
        }
        .gen-btn:active { transform: scale(0.98); }
        .gen-btn:disabled { opacity: 0.6; box-shadow: none; transform: none; }
        
        #loader { display: none; text-align: center; margin: 20px 0; font-weight: 600; color: var(--accent); }
        
        #image-container { display: none; margin-top: 20px; text-align: center; }
        #image-container img { width: 100%; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid var(--glass-border); }
        .dl-btn {
            display: inline-block; background: var(--glass); border: 1px solid var(--glass-border);
            color: white; text-decoration: none; padding: 14px 24px;
            border-radius: 14px; font-weight: 700; font-size: 15px; margin-top: 15px;
        }

        .input-group { display: flex; gap: 10px; margin-top: 10px; }
        .input-group input {
            flex: 1; background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border);
            border-radius: 14px; padding: 14px 15px; color: white; font-size: 16px; outline: none;
        }
        .input-group input:focus { border-color: var(--accent); }
        
        .ref-box {
            background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border);
            border-radius: 14px; padding: 15px; display: flex; justify-content: space-between;
            align-items: center; font-size: 14px; color: var(--text-muted); margin-top: 10px;
        }
        
        .friend-item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--glass-border); }
        .friend-item:last-child { border-bottom: none; }
        .friend-avatar { 
            width: 44px; height: 44px; background: var(--accent-gradient); 
            border-radius: 50%; display: flex; justify-content: center; align-items: center; 
            font-weight: 800; color: white; font-size: 18px; 
        }
    </style>
</head>
<body>

    <svg width="0" height="0">
        <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#2299f8;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#6a5af9;stop-opacity:1" />
        </linearGradient>
    </svg>

    <!-- ЭКРАН: ГЛАВНАЯ -->
    <div id="screen-main" class="animate">
        <div class="header"><h1>AI Студия</h1></div>
        
        <div class="card balance-row">
            <div>
                <div class="balance-title">Мои токены</div>
                <div class="balance-amount"><svg viewBox="0 0 24 24"><path d="M12 2L14.5 9H22L16 13.5L18.5 21L12 16.5L5.5 21L8 13.5L2 9H9.5L12 2Z"/></svg> <span id="balance-val">0</span></div>
            </div>
            <button class="btn-accent" onclick="switchTab('earn')">Пополнить</button>
        </div>

        <div class="card" style="padding: 15px 20px;">
            <div class="action-item" onclick="switchTab('generation')">
                <svg class="action-icon" viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
                Создать фото
                <svg class="action-arrow" viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/></svg>
            </div>
            <div class="action-item" onclick="switchTab('earn')">
                <svg class="action-icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
                Заработать токены
                <svg class="action-arrow" viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/></svg>
            </div>
        </div>

        <div class="header" style="padding-bottom: 5px;"><h1 style="font-size: 20px;">Шаблоны</h1></div>
        <div class="templates-scroll">
            <div class="tpl-card" style="background-image: url('https://image.pollinations.ai/prompt/3d%20cartoon%20head%20of%20a%20guy?nologo=true');" onclick="useTemplate('3d cartoon head of a guy')"><div class="tpl-name">3D голова</div></div>
            <div class="tpl-card" style="background-image: url('https://image.pollinations.ai/prompt/mortal%20kombat%20character%20portrait?nologo=true');" onclick="useTemplate('mortal kombat character portrait')"><div class="tpl-name">Мортал Комбат</div></div>
            <div class="tpl-card" style="background-image: url('https://image.pollinations.ai/prompt/plasticine%20style%20man%20face?nologo=true');" onclick="useTemplate('plasticine style man face')"><div class="tpl-name">Пластилин</div></div>
        </div>
    </div>

    <!-- ЭКРАН: ГЕНЕРАЦИЯ -->
    <div id="screen-generation" class="hidden animate">
        <div class="header"><h1>Генерация</h1></div>
        <div class="card">
            <textarea id="prompt" class="gen-textarea" placeholder="Опиши картинку (на английском)..."></textarea>
            <button class="gen-btn" id="gen-btn" onclick="generateImage()">✨ Сгенерировать (1 токен)</button>
            <div id="loader">⏳ Создаю магию... Подожди около 15-20 секунд.</div>
        </div>
        <div id="image-container" class="animate">
            <img id="result-image" src="" alt="Result">
            <br>
            <a id="download-link" class="dl-btn" href="#" download="image.png">⬇️ Скачать</a>
        </div>
    </div>

    <!-- ЭКРАН: ЗАРАБОТОК -->
    <div id="screen-earn" class="hidden animate">
        <div class="header"><h1>Заработать</h1></div>
        
        <div class="card">
            <div class="balance-title">Ввести промокод</div>
            <div class="input-group">
                <input type="text" id="promo-input" placeholder="Например: SUMMER2026">
                <button class="btn-accent" onclick="redeemPromo()">ОК</button>
            </div>
        </div>

        <div class="card">
            <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                <div style="font-weight: 800; font-size: 18px;">👥 Приглашайте друзей</div>
                <div style="color: var(--success); font-weight: 800; font-size: 16px;">+1 🪙</div>
            </div>
            <div style="font-size: 14px; color: var(--text-muted); margin-bottom: 10px;">Получайте токен за каждого друга.</div>
            
            <div class="ref-box">
                <span id="ref-link-text" style="font-size: 13px;">Загрузка...</span>
                <svg viewBox="0 0 24 24" style="width:22px; height:22px; fill:var(--accent); cursor:pointer;" onclick="copyRef()"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
            </div>
            <button class="gen-btn" style="margin-top: 15px; padding: 14px;" onclick="shareRef()">Пригласить друзей</button>
            
            <div style="margin-top: 25px;">
                <div class="balance-title">Мои друзья (<span id="friends-count">0</span>)</div>
                <div id="friends-list" style="margin-top: 10px; max-height: 250px; overflow-y: auto; padding-right: 5px;"></div>
            </div>
        </div>
    </div>

    <!-- НИЖНЕЕ МЕНЮ -->
    <div class="bottom-nav">
        <button class="nav-btn active" id="nav-main" onclick="switchTab('main')">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            Главная
        </button>
        <button class="nav-btn" id="nav-generation" onclick="switchTab('generation')">
            <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
            Генерация
        </button>
        <button class="nav-btn" id="nav-earn" onclick="switchTab('earn')">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
            Заработать
        </button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        tg.headerColor = "#0f1014";
        tg.backgroundColor = "#0f1014";

        const user = tg.initDataUnsafe.user;
        let balance = 0;
        let refLink = "";

        function switchTab(tab) {
            document.querySelectorAll('.animate').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById(`screen-${tab}`).classList.remove('hidden');
            document.getElementById(`nav-${tab}`).classList.add('active');
            
            const screen = document.getElementById(`screen-${tab}`);
            screen.classList.remove('animate');
            void screen.offsetWidth;
            screen.classList.add('animate');

            if (tab === 'earn') loadFriends();
        }

        function useTemplate(text) {
            document.getElementById('prompt').value = text;
            switchTab('generation');
        }

        async function loadData() {
            if (!user) return;
            try {
                const res = await fetch('/api/balance', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: user.id })
                });
                const data = await res.json();
                balance = data.tokens;
                document.getElementById('balance-val').innerText = balance;
                refLink = data.ref_link;
                document.getElementById('ref-link-text').innerText = refLink.replace('https://', '');
            } catch (e) { console.error(e); }
        }

        async function generateImage() {
            const prompt = document.getElementById('prompt').value;
            if (!prompt) return tg.showAlert("Напиши промпт!");
            if (balance < 1) return tg.showAlert("Нет токенов! Пригласи друга.");

            const btn = document.getElementById('gen-btn');
            const loader = document.getElementById('loader');
            const imgContainer = document.getElementById('image-container');
            const img = document.getElementById('result-image');
            
            btn.disabled = true;
            loader.style.display = 'block';
            imgContainer.style.display = 'none';
            img.src = ''; // Очищаем старую картинку

            try {
                const res = await fetch('/api/generate', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: user.id, prompt: prompt })
                });
                
                const data = await res.json();

                if (data.success) {
                    balance = data.new_balance;
                    document.getElementById('balance-val').innerText = balance;
                    
                    // Вставляем картинку base64
                    img.src = data.image_url;
                    document.getElementById('download-link').href = data.image_url;
                    imgContainer.style.display = 'block';
                    
                    // Лоадер выключится после загрузки картинки (onload)
                } else {
                    tg.showAlert("❌ " + (data.error || "Ошибка"));
                    btn.disabled = false;
                    loader.style.display = 'none';
                }
            } catch (e) { 
                tg.showAlert("❌ Ошибка сети. Сервер не ответил вовремя.");
                btn.disabled = false;
                loader.style.display = 'none';
            }
        }

        function imageLoaded() {
            document.getElementById('loader').style.display = 'none';
            document.getElementById('gen-btn').disabled = false;
        }

        // Убираем обработчик ошибок, который ломал всё, оставляем только базовый
        document.getElementById('result-image').onerror = function() {
            tg.showAlert("❌ Не удалось загрузить картинку. Попробуйте другой промпт.");
            document.getElementById('loader').style.display = 'none';
            document.getElementById('gen-btn').disabled = false;
        };

        async function redeemPromo() {
            const code = document.getElementById('promo-input').value;
            if (!code) return tg.showAlert("Введите код!");
            try {
                const res = await fetch('/api/promo', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: user.id, code: code })
                });
                const data = await res.json();
                if (data.success) {
                    balance = data.new_balance;
                    document.getElementById('balance-val').innerText = balance;
                    tg.showAlert(`✅ Успешно! +${data.reward} токенов.`);
                    document.getElementById('promo-input').value = '';
                } else {
                    tg.showAlert(`❌ ${data.error}`);
                }
            } catch (e) { tg.showAlert("Ошибка при активации"); }
        }

        async function loadFriends() {
            try {
                const res = await fetch('/api/friends', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: user.id })
                });
                const data = await res.json();
                const list = document.getElementById('friends-list');
                document.getElementById('friends-count').innerText = data.friends.length;
                
                if (data.friends.length === 0) {
                    list.innerHTML = '<div style="color:var(--text-muted); font-size:14px; text-align:center; margin-top:10px;">Тут пока пусто</div>';
                } else {
                    list.innerHTML = data.friends.map(f => `
                        <div class="friend-item">
                            <div class="friend-avatar">${(f.first_name || '?')[0].toUpperCase()}</div>
                            <div>
                                <div style="font-weight:700; font-size:15px;">${f.first_name || 'Аноним'}</div>
                                <div style="font-size:13px; color:var(--text-muted);">@${f.username || 'нет'}</div>
                            </div>
                        </div>
                    `).join('');
                }
            } catch (e) { console.error(e); }
        }

        function shareRef() { 
            if(!refLink) return;
            tg.openTelegramLink(`https://t.me/share/url?url=${refLink}&text=Заходи в бота, генерируй картинки!`); 
        }
        
        function copyRef() { 
            if(!refLink) return;
            navigator.clipboard.writeText(refLink); 
            tg.showAlert("Ссылка скопирована!"); 
        }

        if (user) {
            loadData();
        }
    </script>
</body>
    </html>
